<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Quản lý đơn hàng - Hệ thống quản lý bán thuốc" />
  <title>Quản lý đơn hàng - AdminPro</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../../css/reset.css" />
  <link rel="stylesheet" href="../../css/base.css" />
  <link rel="stylesheet" href="../../css/dashboard.css" />
  
  <style>
    /* Modal larger for this form */
    #order-modal .modal {
      max-width: 1200px !important;
    }

    /* Chi tiết đơn hàng styles */
    .order-details-list {
      margin-top: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow-x: auto;
      background: white;
    }

    .order-detail-item {
      display: grid;
      grid-template-columns: 2.5fr 0.8fr 1.2fr 1.2fr 60px;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #f1f5f9;
      align-items: center;
      min-width: 800px;
    }

    .order-detail-item:last-child {
      border-bottom: none;
    }

    .order-detail-header {
      background: #f8fafc;
      font-weight: 600;
      color: #475569;
      font-size: 13px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .form-select-small, .form-input-small {
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .form-input-small:focus,
    .form-select-small:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .btn-remove {
      padding: 6px;
      background: #fee2e2;
      color: #dc2626;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
      white-space: nowrap;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-remove:hover {
      background: #fecaca;
      transform: scale(1.1);
    }

    .order-summary {
      margin-top: 24px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 8px;
      border: 2px solid #e2e8f0;
    }

    .order-form {
      display: flex;
      flex-direction: column;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px solid #e2e8f0;
      flex-shrink: 0;
      background: white;
      position: relative;
      bottom: auto;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      font-size: 15px;
    }

    .summary-row.total {
      border-top: 2px solid #cbd5e1;
      margin-top: 8px;
      padding-top: 16px;
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
    }

    .summary-label {
      color: #64748b;
      font-weight: 500;
    }

    .summary-value {
      font-weight: 600;
      color: #1e293b;
    }

    .summary-value.discount {
      color: #ef4444;
    }

    .summary-value.total {
      color: #16a34a;
      font-size: 20px;
    }

    .customer-points-info {
      margin-top: 8px;
      padding: 12px;
      background: #fef3c7;
      border: 1px solid #fbbf24;
      border-radius: 6px;
      font-size: 13px;
      color: #92400e;
    }

    .points-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      background: #fbbf24;
      color: white;
      border-radius: 12px;
      font-weight: 600;
      font-size: 12px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .order-details-container {
      max-height: 400px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-top: 12px;
    }

    .validation-note {
      margin-top: 12px;
      padding: 12px;
      background: #dbeafe;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      font-size: 13px;
      color: #1e40af;
    }

    .validation-note ul {
      margin: 8px 0 0 20px;
    }

    .validation-note li {
      margin: 4px 0;
    }

    .branch-warning {
      margin-bottom: 12px;
      padding: 12px;
      background: #fef3c7;
      border: 1px solid #fbbf24;
      border-radius: 6px;
      font-size: 13px;
      color: #92400e;
      display: none;
    }

    /* Scrollable modal body */
    #order-modal .modal-body {
      max-height: calc(90vh - 200px);
      overflow-y: auto;
    }

    @media (max-width: 1024px) {
      .order-detail-item {
        grid-template-columns: 1fr;
        gap: 8px;
        min-width: auto;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      #order-modal .modal {
        max-width: 95% !important;
      }
    }

    @media (max-width: 768px) {
      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard-container">
    <div id="header"></div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-layout">
      <div id="sidebar-container"></div>

      <main class="content-area">
        <div class="page-header">
          <h1 class="page-title">🛒 Quản lý đơn hàng</h1>
          <p class="page-subtitle">Tạo và quản lý đơn hàng bán thuốc với tích điểm thưởng</p>
        </div>

        <div class="toolbar">
          <div id="search-container"></div>

          <button class="btn btn-primary" id="add-order-btn">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
            </svg>
            Tạo đơn hàng mới
          </button>
        </div>

        <div id="table-container"></div>
      </main>
    </div>

    <div id="footer"></div>
  </div>

  <div id="modal-root"></div>

  <!-- FORM TEMPLATE -->
  <template id="order-form-template">
    <form id="order-form" class="order-form">
      <!-- Grid 2 cột cho thông tin chung -->
      <div class="detail-grid">
        <!-- KHÁCH HÀNG -->
        <div class="form-group">
          <label class="form-label" for="idkhachHang">
            Khách hàng
          </label>
          <select class="form-select" id="idkhachHang" name="idkhachHang">
            <option value="">-- Khách vãng lai --</option>
          </select>
          <div id="customer-points-display" class="customer-points-info" style="display: none;">
            <strong>💎 Điểm tích lũy hiện tại:</strong> <span id="current-points">0</span> điểm
            <br />
            <small>
              • 1 điểm = 1,000 VNĐ giảm giá<br />
              • Tích lũy: Mỗi 10,000 VNĐ = 1 điểm<br />
              • Tối thiểu 10 điểm mới được sử dụng<br />
              • Giảm tối đa 50% giá trị đơn hàng
            </small>
          </div>
        </div>

        <!-- CHI NHÁNH -->
        <div class="form-group">
          <label class="form-label" for="idchiNhanh">
            Chi nhánh <span class="required">*</span>
          </label>
          <select class="form-select" id="idchiNhanh" name="idchiNhanh" required>
            <option value="">-- Chọn chi nhánh --</option>
          </select>
          <small class="form-note" style="color: #64748b; font-size: 12px; display: block; margin-top: 4px;">
            Chọn chi nhánh để xem thuốc có sẵn tại kho
          </small>
        </div>
      </div>

      <!-- PHƯƠNG THỨC THANH TOÁN -->
      <div class="form-group">
        <label class="form-label" for="idphuongThucTt">
          Phương thức thanh toán <span class="required">*</span>
        </label>
        <select class="form-select" id="idphuongThucTt" name="idphuongThucTt" required>
          <option value="">-- Chọn phương thức thanh toán --</option>
        </select>
      </div>

      <!-- CHI TIẾT ĐƠN HÀNG -->
      <div class="form-group">
        <label class="form-label">
          Chi tiết đơn hàng <span class="required">*</span>
        </label>

        <!-- THÔNG BÁO CHỌN CHI NHÁNH -->
        <div id="branch-warning" class="branch-warning">
          <strong>⚠️ Lưu ý quan trọng:</strong> Vui lòng chọn chi nhánh trước để xem danh sách thuốc có sẵn tại kho của chi nhánh đó.
        </div>
        
        <div class="validation-note">
          <strong>💡 Hướng dẫn:</strong>
          <ul>
            <li>Chọn thuốc từ danh sách có sẵn tại chi nhánh</li>
            <li>Nhập số lượng cần bán (tối thiểu 1)</li>
            <li>Đơn giá và thành tiền sẽ tự động tính</li>
            <li>Có thể thêm nhiều thuốc vào đơn hàng</li>
          </ul>
        </div>
        
        <div class="order-details-container">
          <div class="order-details-list">
            <div class="order-detail-item order-detail-header">
              <div>Thuốc</div>
              <div>Số lượng</div>
              <div>Đơn giá (VNĐ)</div>
              <div>Thành tiền</div>
              <div></div>
            </div>
          </div>
        </div>

        <button type="button" class="btn btn-secondary" id="add-detail-btn" style="margin-top: 12px;">
          ➕ Thêm thuốc
        </button>
      </div>

      <!-- TỔNG KẾT ĐƠN HÀNG -->
      <div class="order-summary">
        <div class="summary-row">
          <span class="summary-label">Tổng tiền hàng:</span>
          <span class="summary-value" id="summary-total">0 ₫</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Tiền giảm giá (Điểm tích lũy):</span>
          <span class="summary-value discount" id="summary-discount">0 ₫</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Số điểm sử dụng:</span>
          <span class="summary-value" id="summary-points-used">0 điểm</span>
        </div>
        <div class="summary-row total">
          <span class="summary-label">Thành tiền:</span>
          <span class="summary-value total" id="summary-final">0 ₫</span>
        </div>
        <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #cbd5e1; font-size: 13px; color: #64748b;">
          <strong>📌 Lưu ý:</strong>
          <ul style="margin: 8px 0 0 20px;">
            <li>Hệ thống tự động áp dụng điểm tích lũy tối đa của khách hàng</li>
            <li>Điểm được sử dụng tối đa 50% giá trị đơn hàng</li>
            <li>Khách hàng sẽ được tích điểm mới sau khi thanh toán</li>
          </ul>
        </div>
      </div>

      <!-- FORM ACTIONS -->
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="cancel-btn">
          Hủy
        </button>
        <button type="submit" class="btn btn-primary" id="submit-btn">
          <span class="btn-text">💾 Tạo đơn hàng</span>
          <span class="btn-loading" style="display: none">
            <span class="loading-spinner"></span> Đang xử lý...
          </span>
        </button>
      </div>
    </form>
  </template>

  <script type="module" src="../../js/pages/admin/donHang.js"></script>
</body>
</html>
